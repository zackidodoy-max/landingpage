<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Page</title><script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4F46E5;--m:#EC4899;--o:#FF7A1A;--y:#FACC15;--g:#10B981;--ink:#1E1B4B;--mut:#475569;--lav:#F5F3FF;--bg:#fff;--card:#fff;--in:#fff;--bd:#E5E7EB;--deep:#1E1B4B;--navbg:#fffd}[data-theme=dark]{--bg:#0F0D2A;--card:#1E1B4B;--lav:#17143A;--ink:#EDEBFF;--mut:#A5A3C7;--in:#2A2760;--bd:#3B3880;--deep:#0B0920;--navbg:#0f0d2add}
*{box-sizing:border-box}body{margin:0;font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);transition:background .3s,color .3s}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;margin:.3em 0}h1{font-size:clamp(30px,5vw,48px)}h2{font-size:clamp(24px,4vw,34px);text-align:center}
section{padding:56px 6%}.alt{background:var(--lav)}.dark{background:var(--deep);color:#fff}
nav{position:sticky;top:0;z-index:9;background:var(--navbg);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:12px 6%}
.btn{display:inline-block;border:0;border-radius:999px;padding:14px 26px;font:700 16px Inter;color:#fff;background:linear-gradient(90deg,var(--o),#F43F5E);cursor:pointer;text-decoration:none;box-shadow:0 0 0 0 #ff7a1a88;animation:pulse 1.8s ease-in-out infinite;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg);animation:shine 2.4s infinite}@keyframes shine{to{left:140%}}.btn:hover{transform:translateY(-3px) scale(1.05);filter:brightness(1.1)}@keyframes pulse{0%,100%{box-shadow:0 0 14px 2px #ff7a1a99,0 0 28px 6px #f43f5e44}50%{box-shadow:0 0 26px 8px #ff7a1add,0 0 48px 14px #f43f5e66}}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;background:var(--lav)}
.slide{aspect-ratio:4/3;border-radius:24px;background:linear-gradient(135deg,var(--p),var(--m));display:grid;place-items:center;color:#fff;font:800 24px 'Plus Jakarta Sans';background-size:cover;background-position:center;box-shadow:0 10px 30px #4f46e52e;transition:opacity .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:24px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 10px 30px #4f46e52e;color:var(--ink);transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 0 24px #ec489966}
.flip{perspective:800px;cursor:pointer;min-height:150px}.flip>div{position:relative;min-height:150px;transition:transform .6s;transform-style:preserve-3d}.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;padding:18px;border-radius:20px;background:var(--card);box-shadow:0 10px 30px #4f46e52e}.flip .b{transform:rotateY(180deg);background:var(--p);color:#fff}.flip:hover .f{box-shadow:0 0 24px #4f46e5aa}
.stars{color:var(--y)}.price{font:800 40px 'Plus Jakarta Sans';color:var(--y)}.old{text-decoration:line-through;opacity:.6}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font:16px Inter;margin:4px 0 12px;background:var(--in);color:var(--ink)}input:focus,select:focus{outline:3px solid #4f46e555;border-color:var(--p)}
label{font-weight:600;font-size:14px}details{background:var(--card);border-radius:16px;padding:14px 18px;margin:10px auto;max-width:760px;box-shadow:0 2px 8px #0001}summary{font-weight:700;cursor:pointer}
dialog{border:0;border-radius:24px;max-width:480px;width:92%;padding:24px;background:var(--card);color:var(--ink)}dialog::backdrop{background:#1e1b4bb3}
#wa{position:fixed;right:18px;bottom:18px;z-index:20;width:58px;height:58px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:0 0 0 0 #10b98199;animation:rip 2s infinite}@keyframes rip{70%{box-shadow:0 0 0 16px #10b98100}}
.cd{display:flex;gap:8px}.cd b{background:#ffffff22;border:1px solid #facc1566;border-radius:12px;padding:8px 14px;color:var(--y);font-size:26px;text-align:center;min-width:62px;box-shadow:0 0 14px #facc1533}
nav b{flex:1;min-width:0;display:flex;align-items:center}nav .btn{white-space:nowrap}#kb{position:fixed;left:14px;bottom:18px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:22px;cursor:pointer;box-shadow:0 4px 14px #0002;padding:0}#bf.off{display:none}.prodimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--lav)}@media(max-width:760px){.hero{grid-template-columns:1fr}nav{padding:10px 4%;gap:8px}nav .btn{padding:9px 16px;font-size:14px}.btn{padding:11px 20px;font-size:15px}h1{font-size:28px}h2{font-size:22px}section{padding:40px 5%}#wa{width:48px;height:48px;font-size:22px;right:14px;bottom:14px}.cd b{font-size:20px;min-width:52px;padding:6px 10px}.card{padding:16px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#bf{position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:9999;will-change:transform}#bf .w{transform-box:fill-box;animation:flap .22s ease-in-out infinite alternate}#bf .wl{transform-origin:100% 50%}#bf .wr{transform-origin:0% 50%}@keyframes flap{to{transform:scaleX(.2)}}</style></head><body>
<nav><b id="brand">Sales Page</b><span style="display:flex;gap:10px;align-items:center"><button id="th" aria-label="Mode gelap" style="background:none;border:1px solid var(--bd);border-radius:99px;padding:8px 12px;cursor:pointer;font-size:16px"></button><a class="btn" href="#harga">Beli Sekarang</a></span></nav>
<section class="hero"><div><h1 id="hh"></h1><p id="hs" style="color:var(--mut)"></p><a class="btn" href="#harga">Beli Sekarang</a></div><div class="slide" id="slide">Produk Digital</div></section>
<section><h2>Apakah Anda mengalami ini?</h2><p id="prob" style="text-align:center;color:var(--mut)"></p><div class="grid" id="pbox"></div></section>
<section class="alt"><h2 id="sh"></h2><p id="sol" style="text-align:center;color:var(--mut)"></p><div class="grid" id="sbox"></div></section>
<section><h2>Isi Produk</h2><div class="grid" id="prods"></div></section>
<section class="alt"><h2>Kata Mereka</h2><div class="grid" id="tes"></div></section>
<section class="dark" id="harga"><h2>Penawaran Spesial</h2><div class="grid" style="align-items:start"><div><div id="offer"></div><p id="cdl" hidden style="margin:18px 0 6px;font-weight:700">⏰ Bonus berakhir dalam:</p><div class="cd" id="cd"></div><h3>Bonus</h3><div id="bon"></div></div>
<form class="card" id="of"><h3>Isi Data Pemesanan</h3><label>Nama Lengkap *</label><input name="n" required minlength="2"><label>Nomor WhatsApp *</label><input name="w" required inputmode="tel" placeholder="08xxxxxxxxxx" pattern="[0-9+ ]{8,16}">
<label>Email (opsional)</label><input name="e" type="email"><label>Produk</label><select name="p" id="sel"></select><button class="btn" style="width:100%">Pesan Sekarang</button></form></div></section>
<section class="alt"><h2>FAQ</h2><div id="faq"></div></section>
<footer class="dark" style="padding:24px 6%;text-align:center">© <span id="yr"></span> <span id="b2"></span> · <a style="color:#fff" id="wl">Chat CS</a> · <a href="privasi.html" style="color:#fff">Kebijakan Privasi</a></footer>
<a id="wa" target="_blank" aria-label="WhatsApp">💬</a>
<dialog id="td"><h3 id="tn"></h3><div class="stars" id="ts"></div><p id="tt"></p><img id="ti" style="max-width:100%;border-radius:12px"><br><button onclick="td.close()">Tutup</button></dialog>
<button id="kb" aria-label="Kupu-kupu on/off">🦋</button><svg id="bf" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><g class="w wl"><path d="M32 30C20 6 2 8 5 24c2 10 14 12 27 8z" fill="url(#g1)" opacity=".92"/><path d="M32 34C16 34 8 54 20 58c8 2 12-10 12-20z" fill="#EC4899" opacity=".85"/></g><g class="w wr"><path d="M32 30C44 6 62 8 59 24c-2 10-14 12-27 8z" fill="url(#g1)" opacity=".92"/><path d="M32 34c16 0 24 20 12 24-8 2-12-10-12-20z" fill="#EC4899" opacity=".85"/></g><ellipse cx="32" cy="34" rx="2.6" ry="14" fill="#1E1B4B"/><path d="M31 21Q26 10 21 8M33 21Q38 10 43 8" stroke="#1E1B4B" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
<div id="toast" style="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#DC2626;color:#fff;padding:10px 18px;border-radius:12px;display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=i=>document.getElementById(i),rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function init(){
 $('yr').textContent=new Date().getFullYear();
 const sid=sessionStorage.sid||(sessionStorage.sid=crypto.randomUUID());sb.rpc('track_visit',{p_session:sid});
 const [s,p,t,f,b,ib]=await Promise.all(['site_settings','products','testimonials','faqs','bonuses','info_boxes'].map(x=>sb.from(x).select('*').order(x=='site_settings'?'key':'sort_order')));
 if([s,p,t,f,b,ib].some(r=>r.error))return toast('Gagal memuat data');
 const c=Object.fromEntries(s.data.map(r=>[r.key,r.value]));
 $('brand').textContent=$('b2').textContent=c.brand;if(c.logo_url)$('brand').innerHTML=`<img src="${esc(c.logo_url)}" alt="${esc(c.brand)}" style="height:46px;max-width:100%;object-fit:contain;display:block">`;$('hh').textContent=c.hero_headline;$('hs').textContent=c.hero_sub;$('prob').textContent=c.problem;const box=k=>ib.data.filter(x=>x.section==k).map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p style="color:var(--mut)">${esc(x.description)}</p></div>`).join('');$('pbox').innerHTML=box('problem');$('sbox').innerHTML=box('solution');$('sh').textContent=c.solution_title||'';$('sol').textContent=c.solution||'';
 const wa=`https://wa.me/${c.whatsapp}?text=${encodeURIComponent('Halo, saya mau tanya produknya')}`;$('wa').href=$('wl').href=wa;
 $('prods').innerHTML=p.data.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.tagline)}</p>${x.images.length?`<img class="prodimg" loading="lazy" decoding="async" src="${esc(x.images[0])}" data-imgs='${esc(JSON.stringify(x.images))}' alt="${esc(x.name)}">`:''}<ul>${x.features.map(i=>`<li>✅ ${esc(i)}</li>`).join('')}</ul></div>`).join('');
 $('sel').innerHTML=p.data.map(x=>`<option value="${x.id}">${esc(x.name)} — ${rp(x.discount_price??x.price)}</option>`).join('');
 const m=p.data[0];if(m)$('offer').innerHTML=`<p class="old">${rp(m.price)}</p><div class="price">${rp(m.discount_price??m.price)}</div>`;
 $('bon').innerHTML=b.data.map(x=>`<div class="card" style="margin:8px 0">🎁 <b>${esc(x.title)}</b> <small>${esc(x.value_label)}</small> <span style="background:var(--y);border-radius:99px;padding:2px 8px;font-size:12px">Terbatas!</span></div>`).join('');
 const dl=b.data.find(x=>x.deadline);if(dl){$('cdl').hidden=false;const tick=()=>{let d=Math.max(0,new Date(dl.deadline)-Date.now())/1e3;$('cd').innerHTML=[['Hari',86400],['Jam',3600],['Menit',60],['Detik',1]].map(([l,v])=>{const n=Math.floor(d/v);d-=n*v;return`<b>${String(n).padStart(2,'0')}<small style="font-size:11px;display:block">${l}</small></b>`}).join('')};tick();setInterval(tick,1000)}
 document.querySelectorAll('img[data-imgs]').forEach(im=>{const a=JSON.parse(im.dataset.imgs);if(a.length>1){let i=0;setInterval(()=>im.src=a[++i%a.length],3500)}});
 $('tes').innerHTML=t.data.map((x,i)=>`<div class="flip" data-i="${i}"><div><div class="f"><b>${esc(x.name)}</b><div class="stars">${'★'.repeat(x.rating)}</div><p>${esc(x.short_text)}</p></div><div class="b"><p>“${esc(x.short_text)}”</p><small>Klik untuk lengkap</small></div></div></div>`).join('');
 document.querySelectorAll('.flip').forEach(e=>e.onclick=()=>{const x=t.data[e.dataset.i];$('tn').textContent=x.name;$('ts').textContent='★'.repeat(x.rating);$('tt').textContent=x.full_text;$('ti').src=x.screenshot_url||'';$('ti').hidden=!x.screenshot_url;td.showModal()});
 setInterval(()=>{const a=document.querySelectorAll('.flip');if(a.length)a[Math.floor(Math.random()*a.length)].classList.toggle('on')},3500);
 $('faq').innerHTML=f.data.map(x=>`<details><summary>${esc(x.question)}</summary><p style="color:var(--mut)">${esc(x.answer)}</p></details>`).join('');
 const imgs=p.data.flatMap(x=>x.images);if(imgs.length){let i=0;const sl=$('slide');sl.textContent='';const go=()=>{sl.style.backgroundImage=`url(${imgs[i++%imgs.length]})`};go();setInterval(go,4000)}
}
$('of').onsubmit=async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('button');btn.disabled=true;
 const {data,error}=await sb.rpc('create_order',{p_name:f.n.value,p_wa:f.w.value,p_email:f.e.value,p_product:f.p.value});btn.disabled=false;
 if(error)return toast('Gagal memesan: '+error.message);location.href='terima-kasih.html?code='+encodeURIComponent(data)};
(()=>{const bf=$('bf');if(!bf)return;
 let mx=innerWidth/2,my=innerHeight/2,x=mx,y=my,ang=0,t=0;const mv=e=>{const q=e.touches?e.touches[0]:e;if(q){mx=q.clientX+14;my=q.clientY+14}};['pointermove','pointerdown','touchstart','touchmove'].forEach(n=>addEventListener(n,mv,{passive:true}));
 const kb=$('kb');if(localStorage.kupu=='off')bf.classList.add('off');kb.onclick=()=>{bf.classList.toggle('off');localStorage.kupu=bf.classList.contains('off')?'off':'on'};
 (function loop(){t+=.05;const dx=mx-x,dy=my-y;x+=dx*.09;y+=dy*.09;
  if(Math.hypot(dx,dy)>6)ang+=((Math.atan2(dy,dx)*180/Math.PI+90-ang+540)%360-180)*.12;
  bf.style.transform=`translate(${x-17}px,${y-17+Math.sin(t*2)*4}px) rotate(${ang}deg)`;requestAnimationFrame(loop)})()})();
init();
</script></body></html>
